version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /ui
      - /tooling
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
