name: Validate iPhone Use
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix ui --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix ui
      - run: git diff --exit-code -- assets/phone-screen.html
      - run: npm audit --prefix tooling --audit-level=moderate
      - run: npm audit --prefix ui --audit-level=moderate
      - run: sh scripts/check.sh
