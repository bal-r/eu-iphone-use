name: Validate iPhone Use
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix ui --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix ui
      - run: git diff --exit-code -- assets/phone-screen.html
      - run: npm audit --prefix tooling --audit-level=moderate
      - run: npm audit --prefix ui --audit-level=moderate
      - run: sh scripts/check.sh
