name: Feature request
description: Describe a task the tool could handle better.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task you want to complete
      description: Explain the workflow and where the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example instruction or alternative
      description: Include an example task or a workaround, if useful.
